name: Dependency Audit
on:
  push:
    branches: [teachlink]
  schedule:
    - cron: "0 9 * * 1"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm ci
      - run: npm audit --audit-level=critical || true
